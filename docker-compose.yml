version: '3.8'

services:
  # ==============================================================
  # 1. DATABASE SERVICE (MariaDB 10.11 / MySQL)
  # ==============================================================
  db:
    image: mariadb:10.11
    container_name: unri-skripsi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-manajemen_skripsi}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - unri_net

  # ==============================================================
  # 2. BACKEND API SERVICE (Node.js Express + MySQL2)
  # ==============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: unri-skripsi-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-manajemen_skripsi}
      PORT: 5000
      NODE_ENV: production
    ports:
      - "${API_PORT:-5000}:5000"
    networks:
      - unri_net

  # ==============================================================
  # 3. FRONTEND SERVICE (React + Vite + Nginx Reverse Proxy)
  # ==============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: unri-skripsi-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - unri_net

# ==============================================================
# VOLUMES & NETWORKS
# ==============================================================
volumes:
  db_data:
    driver: local

networks:
  unri_net:
    driver: bridge
